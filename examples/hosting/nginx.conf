# Example nginx server block for josunlp.de (static hosting).
# Review before use; adjust root/ssl paths to your environment.

server {
	listen 443 ssl;
	http2 on;
	server_name josunlp.de;
	root /var/www/josunlp.de/dist;
	index index.html;

	# ssl_certificate     /etc/letsencrypt/live/josunlp.de/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/josunlp.de/privkey.pem;

	# --- Security headers (see docs/security-headers.md) ------------------
	add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-nTPhegqmvrjZuRuiDtWRYUA0nsamNqLzG7buGcTJGsk=' 'sha256-7sGlICR1u1ehkP45UGXitl7/ffJ1IWxU3psQ/HzGX+M='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	# Enable HSTS only when HTTPS is confirmed working.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	error_page 404 /404.html;

	# --- Precompressed responses -------------------------------------------
	# `bun run build` writes .br and .gz siblings for every text asset, so
	# the server can hand out a maximum-quality artefact without spending
	# CPU per request. gzip_static ships with nginx; brotli_static needs
	# ngx_brotli. Compressing on the fly stays enabled as the fallback for
	# anything without a precompressed sibling.
	# brotli_static on;
	gzip_static on;
	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json
		application/atom+xml application/xml image/svg+xml;

	# --- Blog fallback -----------------------------------------------------
	# Articles uploaded after a build have no prerendered file; serve the
	# client-side shell instead.
	location ~ ^/(de|en)/blog/([a-z0-9-]+)/?$ {
		try_files $uri $uri/index.html /$1/blog/_article/index.html;
	}

	# --- Caching -----------------------------------------------------------
	# Only /assets/ carries a content hash in its file name, so only
	# /assets/ may be immutable. Favicons, logos and the social card live
	# at stable paths and have to stay replaceable — a year of immutable
	# caching on those cannot be undone without renaming the files.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
	location /images/ {
		add_header Cache-Control "public, max-age=604800";
	}
	location = /og-image.png {
		add_header Cache-Control "public, max-age=604800";
	}
	location /content/ {
		add_header Cache-Control "no-cache";
		types {
			text/markdown md;
			application/json json;
		}
	}
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/index.html =404;
	}
}
