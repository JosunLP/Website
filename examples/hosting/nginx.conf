# Example nginx server block for josunlp.de (static hosting).
# Review before use; adjust root/ssl paths to your environment.

server {
	listen 443 ssl;
	http2 on;
	server_name josunlp.de;
	root /var/www/josunlp.de/dist;
	index index.html;

	# ssl_certificate     /etc/letsencrypt/live/josunlp.de/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/josunlp.de/privkey.pem;

	# --- Security headers (see docs/security-headers.md) ------------------
	add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-nTPhegqmvrjZuRuiDtWRYUA0nsamNqLzG7buGcTJGsk=' 'sha256-Cg72eV8ns/6Pzyj/3F54zd4u7PgJMW20RqQ2y8pRR1Y=' 'sha256-+AXE/MttZEXsreUSecYA2V2pvWAOimYV8hZuNKsbvWA='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
	# Enable HSTS only when HTTPS is confirmed working.
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	error_page 404 /404.html;

	# --- Blog fallback -----------------------------------------------------
	# Articles uploaded after a build have no prerendered file; serve the
	# client-side shell instead.
	location ~ ^/(de|en)/blog/([a-z0-9-]+)/?$ {
		try_files $uri $uri/index.html /$1/blog/_article/index.html;
	}

	# --- Caching -----------------------------------------------------------
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
	location /content/ {
		add_header Cache-Control "no-cache";
		types {
			text/markdown md;
			application/json json;
		}
	}
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/index.html =404;
	}
}
